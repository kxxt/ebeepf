[package]
name = "ebeepf"
version = "0.1.0"
license = "LGPL-2.1-only OR BSD-2-Clause"
rust-version = "1.82"
edition = "2021"
repository = "https://github.com/kxxt/ebeepf"
homepage = "https://github.com/kxxt/ebeepf"
description = "A pure Rust, safe and idiomatic eBPF loader and runtime"
readme = "README.md"
keywords = ["bpf", "ebpf", "linux", "tracing"]

[dependencies]
bitflags = "2.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
goblin = { version = "0.10.7", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
libc = "0.2"
object = { version = "0.39", features = ["write"] }
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "socket", "uio"] }
probe = "0.5.2"
tempfile = "3.3"


